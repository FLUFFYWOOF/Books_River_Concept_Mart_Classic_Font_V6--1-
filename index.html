function closeProduct(){document.querySelector('#product-dialog').classList.remove('open');document.body.style.overflow=''}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProduct();toggleCart(false)}});
function add(i){cart[i]=(cart[i]||0)+1;localStorage.setItem('br-cart',JSON.stringify(cart));updateCart();toggleCart(true)}function change(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(cart[i]===0)delete cart[i];localStorage.setItem('br-cart',JSON.stringify(cart));updateCart()}function updateCart(){document.querySelector('#count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);document.querySelector('#cart-list').innerHTML=Object.keys(cart).length?Object.entries(cart).map(([i,q])=>`<div class="cartrow"><img src="assets/${P[i][5]}"><div><strong>${P[i][lang==='en'?0:1]}</strong><div style="font-size:12px;color:#688275">${t().pricePending}</div><button onclick="change(${i},-1)">−</button><span>${q}</span><button onclick="change(${i},1)">+</button></div></div>`).join(''):`<p class="empty">${t().cartEmpty}</p>`}function toggleCart(open){document.querySelector('#cart').classList.toggle('open',open);document.querySelector('#shade').classList.toggle('open',open)}function sendCart(){let items=Object.entries(cart).map(([i,q])=>`${P[i][0]} × ${q}`).join('\n');let body=encodeURIComponent(`Hello Books River Concept Mart, I would like to enquire about these products:\n${items||'(No products selected)'}\nPlease confirm availability and prices.`);window.open(`https://wa.me/60192648802?text=${body}`,'_blank','noopener')};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script><div class="dialog-backdrop" id="product-dialog" onclick="if(event.target===this)closeProduct()" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-label="Product details" id="dialog-content"></section></div></body></html>
